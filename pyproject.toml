[project]
name = "jk"
version = "0.1.0"
description = "Journal Keeper：由 AI 整理的终端记事本 / 任务日志"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
jk = "jk.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
